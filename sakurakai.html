            <div class="item3"><p class="intro"><br><br><br>さくら会に参加して踊りを楽しむメンバーも
                14名になりました。毎月第２、４木曜日、午前10時からお稽古にいそしんでいます。
                踊りと言っても日本舞踊やフラダンス、フラメンコ、ソウシャルダンス、ジャズダンス、いろいろありますが
                私たちは日本各地の伝統民謡への振り付けを習っています。会お揃いの着物もそろいました。
                自治会主催の花まつりや秋祭りに見明川の皆さんに練習の成果をご披露できるのが楽しみです。
                会の世話役は平井さんです。ご興味のある方はいつでもお稽古風景を見に来てください。</p></div>
